[package]
name = "dshline-renderer-node"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dshline-renderer = { path = "../dshline-renderer" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
