name: harness-sync

# Propose the next adopted Harness generation. One question, no verdict:
#
#   Has DeepSeek published a newer authoritative `dsh-v*` release than
#   HARNESS_TARGET, and can dshline mechanically propose adopting it?
#
# Whether dshline actually WORKS against that generation is not asked here and
# must never be. `ci.yml` already answers it — `Harness target` checks the
# revision out from source, links it, typechecks, and runs the capability
# probes — and the pull request this workflow opens gets exactly those checks
# like any other. Two compatibility systems would eventually disagree, and the
# one that ran on a schedule with nobody watching would be the one believed.
#
#   this workflow   is there a newer generation to propose?
#   ci              does dshline work against it?
#
# This replaces the scheduled `Harness upstream · master` lane. Following a
# branch head was the right instinct aimed at the wrong object: an arbitrary
# master commit is not something HARNESS_TARGET can record, so watching one
# produced a signal nobody could act on directly. A release tag is an adoption
# unit, and the difference is not academic — npm's `alpha` pointer moved most
# of a day before the `dsh-v0.1.2-alpha.5` release existed, and only the latter
# was adoptable.
on:
  schedule:
    # Every six hours, at an off-peak minute. Deliberately not frequent: the
    # repository quarantines newly published packages for two hours
    # (`minimumReleaseAge` in pnpm-workspace.yaml), and upstream cuts a
    # generation every few days, so polling faster could only produce runs that
    # find nothing or find something pnpm will refuse to install anyway. Four
    # runs a day bounds the delay at six hours for a chore that used to be
    # unbounded.
    - cron: '43 */6 * * *'
  workflow_dispatch:

concurrency:
  # One proposal at a time. A second run starting while the first is opening a
  # pull request could push the same branch twice; nothing in flight is
  # cancelled, because a half-written adoption branch is worse than a late one.
  group: harness-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    name: propose the adopted Harness generation
    runs-on: ubuntu-latest
    permissions:
      contents: read # read HARNESS_TARGET and the public upstream release metadata

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # Identity first, before anything installs a package graph the candidate
      # chose. This step reads only public GitHub release metadata with the
      # job's own read-only token, so a candidate that turns out to be
      # unresolvable costs nothing and touches no registry.
      - name: resolve the newest authoritative release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/harness-sync.mjs

      # An adoption already under review is not superseded automatically. It
      # may carry a human's or an agent's migration work, and force-pushing a
      # newer candidate over that would discard exactly the expensive part.
      # The maintainer decides whether to supersede it.
      - name: refuse to supersede an open adoption
        id: open-pr
        if: steps.candidate.outputs.kind == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:harness-sync/main" --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            printf 'blocked=true\n' >> "$GITHUB_OUTPUT"
            printf 'number=%s\n' "$EXISTING" >> "$GITHUB_OUTPUT"
          else
            printf 'blocked=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: apply the candidate
        id: apply
        if: steps.candidate.outputs.kind == 'candidate' && steps.open-pr.outputs.blocked == 'false'
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          TAG: ${{ steps.candidate.outputs.tag }}
          PR_BODY_PATH: ${{ runner.temp }}/harness-sync-body.md
          # The retirement read fetches the candidate's git tree to learn which
          # packages it still publishes, so this step needs the same read-only
          # token the resolve step uses. GitHub does not export the job token
          # into a step's environment and `gh` refuses to run without it — which
          # failed the whole adoption here, before anything was written, and was
          # invisible locally where `gh` is already authenticated.
          GH_TOKEN: ${{ github.token }}
        run: node tools/harness-sync.mjs --apply "$VERSION" "$REVISION" "$TAG"

      # pnpm is the authority on whether the candidate may be installed yet.
      # `minimumReleaseAge` quarantines a newly published version for two
      # hours, and a generation cut minutes ago will be refused here — which is
      # the policy working, not an incompatibility and not a reason to open a
      # pull request whose lockfile does not match its manifests. The next
      # scheduled run picks it up once it matures. Nothing recomputes package
      # ages independently; the installer's own refusal is the signal.
      - name: refresh the lockfile through the ordinary install path
        id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          # `pipefail`, because GitHub's default shell for a `run:` block is
          # `bash -e` and not `bash -eo pipefail`. Without it the exit status of
          # this pipeline is tee's, which is always zero — so an install that
          # pnpm refused reported success, `steps.install.outcome` never became
          # `failure`, and the two steps below that exist to tell a release-age
          # quarantine apart from a real breakage never ran at all. A candidate
          # that could not be installed would have gone on to open a pull
          # request carrying a lockfile that does not match its manifests.
          set -o pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tee install.log

      - name: classify an install refusal
        id: quarantine
        if: steps.install.outcome == 'failure'
        run: |
          if grep -q 'ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION' install.log; then
            printf 'quarantined=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'quarantined=false\n' >> "$GITHUB_OUTPUT"
          fi

      # Any install failure that is NOT the release-age quarantine is a real
      # problem a human has to see, not something to open a pull request about.
      #
      # This stays RED, deliberately. Two very different refusals land here and
      # pnpm reports them identically: upstream may simply not have finished
      # publishing this generation, or upstream may have RETIRED a package this
      # repository governs. The first is lag; the second is a breaking change
      # that no mechanical proposal can express, and only CI plus a migration
      # can answer it. This workflow cannot tell them apart from the install log
      # alone, and guessing "lag" would green-wash a documented breaking change
      # for as long as it went unnoticed. Fail closed, and let a human read it.
      - name: fail on an install refusal that is not quarantine
        if: steps.install.outcome == 'failure' && steps.quarantine.outputs.quarantined != 'true'
        run: |
          printf '%s\n' 'The candidate could not be installed, and not because of the release-age window.' >&2
          printf '%s\n' 'Either upstream has not finished publishing this generation, or it retired a' >&2
          printf '%s\n' 'package this repository governs. The second is a migration and is deliberately not' >&2
          printf '%s\n' 'green here: this lane proposes, and the pull request CI would open is what decides.' >&2
          tail -40 install.log >&2
          exit 1

      # Cheap and deterministic: prove the MECHANICAL state this pull request
      # would carry is internally coherent before proposing it — HARNESS_TARGET
      # and the governed pins, and nothing else. `--mechanical` deliberately
      # skips the HARNESS_COMPAT reconciliation, because a mechanically advanced
      # target leaves every shim record naming the previous generation by
      # construction; deciding that record is the adopter's job ON the pull
      # request this step exists to open. The full check, compatibility
      # included, runs in ci.yml's blocking `Harness target` lane on that pull
      # request and stays red until the decision is made. Running the full check
      # here would mean the proposer could never open a proposal whenever a shim
      # exists, which is exactly the state a proposal is in.
      - name: the proposed tree is mechanically coherent
        if: steps.install.outcome == 'success'
        run: node tools/harness-target.mjs --mechanical

      # The same repository-scoped credential the Version Packages pull request
      # uses, and for the same reason: a pull request created with the built-in
      # GITHUB_TOKEN does not start the checks this repository requires, and a
      # generated adoption whose CI never runs is worse than no automation at
      # all. It carries Contents and Pull requests write and nothing else — no
      # release token, no npm credential, no OIDC. It is scoped to this step,
      # so nothing that installed or built upstream code ever saw it.
      - name: open or update the adoption pull request
        id: pr
        if: steps.install.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # zizmor: ignore[superfluous-actions] updates one stable branch rather than creating a pull request per run; v8.1.1
        with:
          token: ${{ secrets.VERSION_TOKEN }}
          commit-message: 'chore(dshline): adopt Harness ${{ steps.candidate.outputs.version }}'
          title: 'chore(dshline): adopt Harness ${{ steps.candidate.outputs.version }}'
          body-path: ${{ runner.temp }}/harness-sync-body.md
          base: main
          branch: harness-sync/main
          delete-branch: true

      - name: summary
        if: always()
        env:
          KIND: ${{ steps.candidate.outputs.kind }}
          SUMMARY: ${{ steps.candidate.outputs.summary }}
          BLOCKED_BY: ${{ steps.open-pr.outputs.number }}
          QUARANTINED: ${{ steps.quarantine.outputs.quarantined }}
          PROPOSED: ${{ steps.pr.outcome }}
        run: |
          {
            echo "### Harness sync"
            echo
            echo "$SUMMARY"
            if [ "$BLOCKED_BY" != '' ]; then
              echo
              echo "Adoption #$BLOCKED_BY is already open. It may carry migration work, so it is"
              echo 'not superseded automatically — merge or close it, or update it deliberately.'
            elif [ "$QUARANTINED" = 'true' ]; then
              echo
              echo 'The generation exists but its packages are still inside the repository'
              echo '`minimumReleaseAge` window, so pnpm refused to install them. No pull request'
              echo 'was opened and nothing was bypassed; the next scheduled run will retry.'
            elif [ "$PROPOSED" = 'success' ]; then
              # The ONLY branch that may claim an adoption exists. It is gated on
              # the pull-request step's own outcome rather than on the candidate
              # being found, because every failure between here and there — a
              # refused install, a failed `--apply`, a failed coherence check —
              # leaves a candidate with no pull request behind it. Keying this on
              # the candidate instead is how a run reported "ordinary CI on that
              # pull request" for a pull request that was never opened.
              echo
              echo 'Adoption proposed from mechanical state only. Ordinary CI on that pull request is'
              echo 'authoritative for compatibility; red means migrate forward, never restore support'
              echo 'for the previous one. A red `Harness target` check can also mean a HARNESS_COMPAT'
              echo 'record still names the previous generation and needs a deliberate decision: confirm'
              echo 'the defect remains and bump the record, or delete the shim with its wiring and tests.'
            elif [ "$PROPOSED" = 'failure' ]; then
              # The pull-request step RAN and failed. Claiming it "never reached"
              # here would be false, and this is the state a missing or
              # under-scoped credential produces — which is exactly when a
              # reader most needs the summary to point at the right log.
              echo
              echo '**The pull-request step ran and failed**, so no adoption was proposed. The'
              echo 'install and the mechanical coherence check both succeeded; the failure is in'
              echo 'creating or updating the pull request itself, most often a missing or'
              echo 'under-scoped credential. Read that step log, not the installer log.'
            elif [ "$KIND" = 'candidate' ]; then
              echo
              echo '**No pull request was opened**, and nothing was bypassed: this candidate never'
              echo 'reached the pull-request step. A failed `--apply`, a refused install, or a'
              echo 'failed coherence check all leave no pull request behind. Either upstream has'
              echo 'not finished publishing this generation, or it retired a package this'
              echo 'repository governs — the second is a breaking change that only a hand'
              echo 'migration can answer. Read the run log; do not adopt a version the registry'
              echo 'does not serve.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
