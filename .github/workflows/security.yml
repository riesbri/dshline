name: security

# Consolidates what used to be three workflows (security, codeql, scorecard)
# into one, with the same triggers, permissions, and fork-safety each job had
# on its own — see each job for what changed and what deliberately did not.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because a dependency or a query pack that was clean when it merged
  # does not stay clean: an advisory or a new CodeQL query published tomorrow
  # applies to code nobody is touching. One coherent time for every scheduled
  # job here; the three separate weekly crons this replaces had no reason to
  # stay staggered.
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the jobs that need more ask for it themselves.
permissions:
  contents: read

# Every action is pinned to a commit, not a tag. A tag is a mutable pointer the
# action's owner can move, so `@v4` is a standing grant to run whatever they
# publish next — this repository saw `pnpm/action-setup@v4` change commits between
# two consecutive CI runs. Dependabot proposes the bumps, and a human reads them.
jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # --ignore-scripts because an install script is arbitrary code from a
      # dependency, and nothing in this repository needs one to audit. The
      # lockfile is verified rather than trusted: `--trust-lockfile` would skip
      # the release-age and trust-downgrade checks, and on a pull request the
      # lockfile is exactly the untrusted input those checks exist for.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Moderate and above fails the build. The tree is small enough that this is
      # an honest gate rather than a wall of noise to be ignored.
      - run: pnpm audit --audit-level moderate

  new-dependencies:
    name: new dependencies
    # A pull request is the only place this can compare two trees, and the only
    # place the answer can still change a decision.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # A licence this project cannot ship under is a defect in the same way
          # a vulnerability is, and it is far cheaper to catch before it lands.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, LGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because a secret that was committed and then
          # removed is still published: rewriting the tip does not unpublish it,
          # and this repository has already been recreated once to erase an
          # author address that reached a public commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-hardening:
    name: workflow hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same entry point a contributor runs as `pnpm run security`, so the
      # rules cannot drift between here and a laptop. It pins zizmor's version
      # itself; see tools/lint-workflows.mjs.
      - run: node tools/lint-workflows.mjs

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      # A report only a workflow log holds is a report nobody reads.
      security-events: write # write findings into the code-scanning view
      contents: read # read the source being analysed
      actions: read # let the analysis read this workflow's own run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # `security-extended` over the default pack. The default set is tuned
          # for a low false-positive rate on large codebases; this one is two
          # small packages, so the extra queries cost a minute and cover the
          # things that actually matter here — an unsanitised value reaching a
          # terminal write, a regular expression that backtracks badly on model
          # output, a path built from a tool's arguments.
          queries: security-extended
          config: |
            paths-ignore:
              - '**/lib/**'
              - 'tests/**'
              - '**/tests/**'

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript

  scorecard:
    name: scorecard
    # Grades the repository's own supply-chain posture — branch protection,
    # pinned dependencies, whether releases are signed, how long a vulnerability
    # sits — which is a different question from whether the code has a bug in
    # it. It cannot run on a pull request from a fork, because it needs a token
    # a fork must never get, so it runs on the default branch and on schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # write the grade into the code-scanning view
      id-token: write # prove this run's identity to the OpenSSF API, instead of a stored secret
      contents: read # read the repository being graded
      actions: read # read the workflow definitions the grade is partly based on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif

  # The security counterpart of `CI · required`, and the same reasoning: one
  # stable context for branch protection instead of five that move.
  #
  # Scorecard is deliberately absent. It grades the repository's own posture
  # rather than this change, cannot run on a fork pull request at all, and is
  # not a merge gate — requiring it would make every fork contribution
  # unmergeable.
  #
  # `new-dependencies` only runs on a pull request, which is the one event this
  # gate is required on, so it is expected to have succeeded here rather than
  # skipped. Every other dependency is unconditional. `always()` plus an
  # explicit comparison against 'success' is what keeps a skipped or cancelled
  # dependency from reading as a pass — GitHub treats a SKIPPED required check
  # as satisfied, so a gate that skipped itself would be worse than none.
  required:
    name: Security · required
    if: always() && github.event_name == 'pull_request'
    needs: [advisories, new-dependencies, secrets, workflow-hardening, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: every pull-request security job must have succeeded
        env:
          RESULTS: >-
            advisories=${{ needs.advisories.result }}
            new-dependencies=${{ needs.new-dependencies.result }}
            secrets=${{ needs.secrets.result }}
            workflow-hardening=${{ needs.workflow-hardening.result }}
            codeql=${{ needs.codeql.result }}
        run: |
          printf '%s\n' "$RESULTS" | tr ' ' '\n' | sed '/^$/d'
          for entry in $RESULTS; do
            case "$entry" in
              *=success) ;;
              *) printf '%s\n' "security job not successful: $entry" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' 'every pull-request security job succeeded'
