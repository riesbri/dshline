name: ci

# dshline tracks DeepSeek Harness aggressively and supports it narrowly: ONE
# adopted Harness architecture at a time, with obsolete assumptions deleted
# rather than carried behind a compatibility layer. This file answers exactly
# one question, about exactly one commit:
#
#   Is this repository commit correct against the exact adopted target?
#
#   Core              is dshline itself correct?                      BLOCKING
#   Harness target    does it work against the exact upstream source
#                     revision it claims to support (HARNESS_TARGET)?  BLOCKING
#   Harness published does the packed bundle boot beside the exact target? BLOCKING once npm carries the target
#   Bootstrap         does the current wrapper survive the default install? DIAGNOSTIC only
#
# The blocking questions never follow anything mutable — no branch, no npm
# dist-tag. Both are pointers somebody else moves, and a merge gate keyed on one
# can turn red for a reason no commit in this repository caused. The bootstrap
# diagnostic observes that mutable distribution state without making it a
# compatibility claim or a merge gate.
#
# There is no scheduled run and no `Harness upstream · master` lane any more.
# Watching a branch head was aimed at the wrong object: an arbitrary master
# commit is not something HARNESS_TARGET can record, so the signal was never
# directly actionable. `.github/workflows/harness-sync.yml` watches upstream's
# `dsh-v*` RELEASE tags instead — an adoption unit — and proposes the next
# generation as an ordinary pull request, which then runs the jobs below like
# any other.
#
#   pull_request / push(main) / workflow_dispatch : every job
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref and event kind.
# Keyed on event name too, so a manual diagnostic dispatch is never cancelled
# by an unrelated push to main that happens to land at the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commits rather than tags: a tag is a mutable pointer its
# owner can move, so `@v4` is a standing grant to run whatever they publish next,
# and this repository saw `pnpm/action-setup@v4` change commits between two
# consecutive runs. `.github/workflows/security.yml` checks that this holds.
jobs:
  core:
    name: Core · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 rather than the newest Node 22 patch: engines declares the
        # floor as `^22.19`, and testing the newest 22.x would let code that
        # only works from 22.20 onward pass silently. 24 and 26 track their
        # latest patch, because nothing here promises a floor inside those
        # majors the way `^22.19` names one inside 22.
        node: ['22.19', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job's token is left in .git/config, where anything later
          # in the job — including a dependency's build script — can read it, and
          # an uploaded artifact can carry it out of the run.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Every dsh-* dependency in both manifests is pinned to HARNESS_TARGET's
      # version, so this ordinary install builds and tests against the adopted
      # Harness generation — the same one `Harness target` checks out from
      # source — rather than whatever a floating range happened to resolve to.
      # `tools/harness-target.spec.mjs` is what enforces that, and it runs as
      # part of the suite below.
      # --ignore-scripts: an install script is arbitrary code from a dependency,
      # and nothing here needs one to build or test. The lockfile is verified, not
      # trusted — see the supply-chain policies in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The adopted generation's own prerequisites, which the pins above do not
      # cover. `@deepseek-ai/cordis` and `@deepseek-ai/schemastery` version on
      # their own numbering and are deliberately NOT pinned to
      # HARNESS_TARGET.version, but the Harness line still states floors for
      # them, and those floors move between generations. Harness 0.1.2 raised
      # both while this repository still declared the older ones, and nothing
      # noticed for two generations: an unmet peer is a warning pnpm prints and
      # a build ignores, and the source-linked `Harness target` lane below
      # cannot see it at all, because linking a Harness checkout substitutes
      # that checkout's own `vendor/cordis`.
      #
      # `pnpm peers check` reads the lockfile, needs no network, and exits
      # non-zero on an unmet or missing peer. It states no Harness-specific
      # opinion and rewrites nothing — it just refuses to let the installed
      # graph disagree with itself, which is exactly the class of drift that
      # went unseen. A red result here is a small manifest correction, not a
      # compatibility question.
      - run: pnpm peers check

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run test

  windows-launcher:
    # Focused on purpose: the whole suite already runs on Linux, and what only
    # Windows can answer is the launcher hand-off. What npm installs there is a
    # `dsh.cmd` batch shim — `spawn` refuses to run one directly since the
    # CVE-2024-27980 hardening, and a bare `dsh` names no file — so the wrapper
    # goes through `cmd.exe`, and a quoting layer is worth only as much as the
    # argv a shim actually received. These two specs record that argv.
    name: Windows launcher · npm .cmd shim
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: launcher resolution and the .cmd shim hand-off
        run: pnpm exec vitest run packages/dshline/tests/launcher-policy.spec.ts packages/dshline/tests/launcher-bootstrap.spec.ts

  docs:
    name: Docs · EN/ZH pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Compares each side's recorded blob hash and their Markdown structure.
      # Needs no dependencies, so it runs standalone rather than after an
      # install the check itself never touches.
      - run: node tools/verify-translation-pairing.mjs

  harness-target:
    # The architecture dshline claims to support, checked out from source at
    # the exact commit `HARNESS_TARGET` names. Blocking, and deterministic
    # because the revision is a full commit sha a human wrote down — not a
    # branch, not a dist-tag, nothing that can move between two runs of the
    # same commit of this repository.
    #
    # This replaces the previous Minimum/Released pair. Both existed to
    # maintain several published Harness lines at once, and by the end they
    # were pinning the same version by two different mechanisms — a fixed
    # floor and a `next` dist-tag that had caught up to it.
    name: Harness target · adopted source revision
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repository and the public harness source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # This job installs a second, foreign package graph (the harness
          # checkout's own). Keep its store out of the ordinary lanes' cache.
          package-manager-cache: false

      # HARNESS_TARGET is the only place the adopted revision is written down;
      # reading it here rather than repeating it in this file is what keeps a
      # migration to one commit instead of two files that can disagree.
      - name: read the adopted harness target
        id: target
        run: |
          {
            echo "revision=$(node tools/harness-target.mjs --revision)"
            echo "version=$(node tools/harness-target.mjs --version)"
          } >> "$GITHUB_OUTPUT"

      # Two files in THIS repository against the target above: every dsh-*
      # spec is exactly the adopted version, and every temporary workaround in
      # HARNESS_COMPAT has been reconciled with it. Nothing here reads upstream
      # source, so it costs a second and couples this lane to no external
      # layout — it exists so a hand-edited HARNESS_TARGET is caught here
      # rather than at release, which is where the Harness-Sync proposal and
      # the publish lane already run the same check.
      - name: this repository is coherent with the adopted target
        run: node tools/harness-target.mjs

      - name: check out the adopted harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.target.outputs.revision }}
          path: .harness
          persist-credentials: false

      # HARNESS_TARGET records a commit and a version on two separate lines,
      # and nothing about the file stops them describing different
      # generations. That mistake would otherwise be invisible: this lane
      # would typecheck against one generation's source while Core and the
      # published lane validated another, and every job would pass. The
      # Harness workspace root's own manifest is the authority for which
      # generation a commit belongs to. Checked before the expensive build, so
      # an incoherent target fails in seconds.
      - name: verify the checked-out source is the adopted generation
        run: node tools/harness-target.mjs --verify-source .harness

      # Build only inside the separate checkout. --ignore-scripts avoids
      # lifecycle code; the explicit build below is the one reviewed operation
      # needed to emit the declarations link-harness.mjs validates.
      - name: install and build the harness declarations
        working-directory: .harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      # Rewrites package links and the lockfile only in the disposable runner,
      # exactly the way tools/link-harness.mjs links a local checkout for
      # manual development. TypeScript — and vitest's runtime module resolution
      # below — then resolve the declarations just built rather than the
      # registry's published tarballs.
      - name: link the built harness declarations
        run: |
          node tools/link-harness.mjs .harness
          pnpm install --no-frozen-lockfile --ignore-scripts
          node tools/link-harness.mjs --check

      - id: typecheck
        continue-on-error: true
        run: |
          pnpm run typecheck 2>&1 | tee typecheck.txt
          exit "${PIPESTATUS[0]}"

      # Focused rather than a second full suite: Core already established
      # dshline's own correctness on every supported Node against this same
      # generation's published packages. What only source-linking can answer is
      # whether the Harness-facing seams still hold, and capability-report
      # names which one broke instead of producing a wall of tsc diagnostics.
      # It runs through vitest's transpile-only execution, so a type-only
      # upstream change can leave it green and still fail the typecheck above —
      # two independent signals on purpose.
      - id: capability
        continue-on-error: true
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: node tools/capability-report.mjs "target ($TARGET_VERSION)" | tee capability.txt

      - name: target verdict
        if: always()
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
        run: |
          {
            echo "Adopted Harness target: $TARGET_VERSION @ ${REVISION:0:8}"
            echo "source typecheck: $([ "$TYPECHECK_OUTCOME" = success ] && echo PASS || echo FAIL)"
            echo
            cat capability.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            {
              echo '<details><summary>typecheck output</summary>'
              echo
              echo '```'
              cat typecheck.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Blocking: this is the architecture dshline says it supports. If it
          # is red, either the claim in HARNESS_TARGET is wrong or the change
          # under review broke it.
          if [ "$TYPECHECK_OUTCOME" != "success" ] || [ "$CAPABILITY_OUTCOME" != "success" ]; then
            exit 1
          fi

  harness-published:
    # The blocking question npm answers and source cannot: can this packed
    # bundle boot beside the exact adopted launcher? The bootstrap below is a
    # separate distribution diagnostic because its first run installs the
    # published dshline package from the registry, not this source tree.
    #
    # Publication lag is reported as itself. GitHub source moves first and npm
    # catches up later; "the generation we target is not on the registry yet"
    # is a release-channel fact, not evidence that dshline is broken against
    # the architecture it targets — and it must never be the reason someone
    # writes compatibility code for an older published line.
    name: Harness published · consumer install path
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: read the adopted harness target
        id: target
        run: echo "version=$(node tools/harness-target.mjs --version)" >> "$GITHUB_OUTPUT"

      # An exact version lookup, never a dist-tag: which channel upstream
      # publishes a generation under is a distribution detail that changes
      # without the architecture changing.
      - name: has npm published the adopted generation yet
        id: published
        run: node tools/harness-target.mjs --published | tee -a "$GITHUB_OUTPUT"

      - if: steps.published.outputs.published == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - if: steps.published.outputs.published == 'true'
        run: pnpm run build

      # The authoritative consumer path: this commit's packed bundle beside
      # the exact adopted launcher, a fresh profile, a real pseudo-terminal,
      # startup banner, and clean ctrl-d. Types resolving is not a boot.
      - name: boot the packed plugin beside the published launcher
        id: packed
        if: steps.published.outputs.published == 'true'
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: node tools/consumer-smoke.mjs --launcher-version "$TARGET_VERSION"

      # This is the advertised default-install sequence: `npm install -g`
      # then `dshline`, against an empty harness home. It intentionally follows
      # npm's current distribution state: the wrapper comes from this commit,
      # but the first run installs the published dshline package from the
      # registry. That makes it useful operational evidence, not a compatibility
      # verdict for this source tree. A hand-run `pnpm test:consumer` has the
      # same default when no launcher version is supplied.
      - name: first run from nothing, beside the default launcher
        id: bootstrap
        continue-on-error: true
        if: steps.published.outputs.published == 'true'
        run: node tools/consumer-smoke.mjs --bootstrap

      - name: consumer verdict
        if: always()
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          PUBLISHED: ${{ steps.published.outputs.published }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          {
            if [ "$PUBLISHED" = "true" ]; then
              if [ "$PACKED_OUTCOME" = "success" ]; then
                echo "Exact-target consumer: PASS (@deepseek-ai/dsh@$TARGET_VERSION)"
              else
                echo "Exact-target consumer: FAIL ($PACKED_OUTCOME)"
              fi
              if [ "$BOOTSTRAP_OUTCOME" = "success" ]; then
                echo 'Default-install bootstrap: PASS (diagnostic only)'
              else
                echo "Default-install bootstrap: FAIL ($BOOTSTRAP_OUTCOME; diagnostic only; does not invalidate HARNESS_TARGET compatibility)"
              fi
            else
              echo "Exact-target consumer: SKIPPED (@deepseek-ai/dsh@$TARGET_VERSION is not on npm yet)"
              echo 'Default-install bootstrap: SKIPPED (adopted launcher is not published; diagnostic not run)'
              echo 'This is publication lag, not an incompatibility: dshline targets an upstream'
              echo 'source revision, and the registry catches up afterwards. It is never a reason'
              echo 'to support an older published generation.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # One stable verdict, so branch protection names a contract rather than an
  # inventory. Requiring every leaf would mean editing the repository ruleset
  # each time the Node matrix or a job id changes — external configuration
  # churn driven by an internal rename, and a required check left dangling if
  # anyone forgot.
  #
  # It contains no build or test logic of its own: duplicating any of that here
  # would create a second place for the answer to come from. The `needs` graph
  # IS the assertion.
  #
  # `always()` is what makes the result honest. Without it this job would be
  # SKIPPED when a dependency fails, and GitHub reports a skipped required
  # check as satisfied — a red CI that merges. With it the job always runs and
  # decides for itself, and `result` is compared against 'success' explicitly
  # rather than trusting `!failure()`, which is true for a cancelled or skipped
  # dependency too. A matrix contributes ONE result across every leg, so a
  # single red Node version makes `needs.core.result` anything but 'success'.
  required:
    name: CI · required
    if: always()
    needs: [core, windows-launcher, docs, harness-target, harness-published]
    runs-on: ubuntu-latest
    steps:
      - name: every blocking lane must have succeeded
        env:
          RESULTS: >-
            core=${{ needs.core.result }}
            windows-launcher=${{ needs.windows-launcher.result }}
            docs=${{ needs.docs.result }}
            harness-target=${{ needs.harness-target.result }}
            harness-published=${{ needs.harness-published.result }}
        run: |
          printf '%s\n' "$RESULTS" | tr ' ' '\n' | sed '/^$/d'
          for entry in $RESULTS; do
            case "$entry" in
              *=success) ;;
              *) printf '%s\n' "blocking lane not successful: $entry" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' 'every blocking CI lane succeeded'
