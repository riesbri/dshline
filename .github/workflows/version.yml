name: version

on:
  push:
    branches: [main]
    paths: ['.changeset/**']
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      recovery-commit:
        description: merged Version Packages commit whose missing tag should be recovered
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A merged Version Packages PR also produces a push to main. Keep its tag job
  # in a different lane, or that push could cancel the tag before it reaches npm.
  group: version-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The version job needs the checked-in changesets, while tagging must wait for a
# human to merge the generated PR. Keeping them as distinct jobs also means the
# PR-producing token is not available when a merged tree is tagged.
jobs:
  version:
    name: open version PR
    # A manual run is an operator action, not permission to execute a branch's
    # changesets or create-pull-request code. Recovery is tag-only, and normal
    # versioning is accepted only from the reviewed main workflow.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recovery-commit == '')
    runs-on: ubuntu-latest
    # VERSION_TOKEN supplies the two write scopes needed for the generated
    # branch and PR. The built-in token stays read-only, so a compromised
    # versioning dependency cannot inherit repository-write access.
    permissions:
      contents: read # check out the changesets to be consumed
    outputs:
      has-changesets: ${{ steps.check-changesets.outputs.has-changesets }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the exact reviewed event commit, not a branch that can move.
          ref: ${{ github.sha }}
          persist-credentials: false

      # README.md documents Changesets; it is not a release record. Looking for
      # every Markdown file would make an empty queue look non-empty and cause
      # `changeset version` to fail after a Version Packages PR is merged.
      - name: check for changesets
        id: check-changesets
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            printf 'has-changesets=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has-changesets=false\n' >> "$GITHUB_OUTPUT"
          fi

      # Do this before producing a PR: a missing token otherwise is discovered
      # only after its merge, when the tag cannot start the tag-only publisher.
      - name: release tag token must be configured
        if: steps.check-changesets.outputs.has-changesets == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            printf '%s\n' 'RELEASE_TOKEN is required to create the release tag.' >&2
            printf '%s\n' 'Add a fine-grained, repository-scoped PAT with Contents: write.' >&2
            exit 1
          fi

      # A pull request made with GITHUB_TOKEN cannot start the required PR
      # checks. Use a distinct, repository-scoped PAT so those checks run before
      # a human merges the generated version PR; it never creates release tags.
      - name: version PR token must be configured
        if: steps.check-changesets.outputs.has-changesets == 'true'
        env:
          VERSION_TOKEN: ${{ secrets.VERSION_TOKEN }}
        run: |
          if [ -z "$VERSION_TOKEN" ]; then
            printf '%s\n' 'VERSION_TOKEN is required to create a checked Version Packages PR.' >&2
            printf '%s\n' 'Add a fine-grained, repository-scoped PAT with Contents and Pull requests: write.' >&2
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.check-changesets.outputs.has-changesets == 'true'
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check-changesets.outputs.has-changesets == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.check-changesets.outputs.has-changesets == 'true'

      - name: consume changesets and bump versions
        if: steps.check-changesets.outputs.has-changesets == 'true'
        run: pnpm changeset version

      # Changesets owns the manifests, while the runner's startup banner embeds
      # the version in source. Keep the generated PR's two copies together so
      # the release gate never discovers this only after a tag was pushed.
      - name: sync the embedded banner version
        if: steps.check-changesets.outputs.has-changesets == 'true'
        run: node tools/sync-version.mjs

      - name: create or update version PR
        if: steps.check-changesets.outputs.has-changesets == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # zizmor: ignore[superfluous-actions] updates one stable PR rather than creating one per commit; v8.1.1
        with:
          token: ${{ secrets.VERSION_TOKEN }}
          commit-message: 'chore: version packages'
          title: 'Version Packages'
          body: |
            This PR was auto-generated by the version workflow.
            Merging it will bump package versions and update CHANGELOG.md.
            Do not edit manually — the next release will overwrite changes.
          base: main
          branch: changeset-release/main
          delete-branch: true

  tag:
    name: tag version
    # Serialize the preflight and tag creation. Without this, two merged/recovery
    # events could both observe no active publisher before either creates its tag.
    concurrency:
      group: release-tag-handoff
      cancel-in-progress: false
    # A job condition resolves before its steps, so source validation belongs in
    # the first step. Keep routine main pushes out of this job entirely.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # RELEASE_TOKEN is a fine-grained PAT whose tag push is not limited by this
    # job token. The job itself only reads the merged tree before using that PAT.
    permissions:
      actions: read # refuse a second tag while its predecessor is still publishing
      contents: read # check out the merged version PR tree
      pull-requests: read # validate a recovery commit against its merged PR

    steps:
      - name: determine tag source
        id: tag-source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF: ${{ github.ref }}
          RECOVERY_COMMIT: ${{ github.event.inputs.recovery-commit }}
        run: |
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            if [ "$PR_MERGED" = 'true' ] && \
              [ "$PR_BASE" = 'main' ] && \
              [ "$PR_REPO" = "$REPO" ] && \
              [ "$PR_BRANCH" = 'changeset-release/main' ] && \
              { [ "$PR_USER" = 'app/github-actions' ] || [ "$PR_USER" = 'github-actions[bot]' ] || [ "$PR_USER" = "$REPO_OWNER" ]; } && \
              [ "$PR_TITLE" = 'Version Packages' ]; then
              printf 'source=pr\n' >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$RECOVERY_COMMIT" ]; then
            if [ "$REF" != 'refs/heads/main' ] || ! [[ "$RECOVERY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\n' 'Recovery requires a full lowercase commit SHA and must run from main.' >&2
              exit 1
            fi
            printf 'source=recovery\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tag-source.outputs.source != ''
        with:
          # A merged PR tags its merge commit; recovery checks out the selected
          # commit and verifies it is already reachable from protected main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.recovery-commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.tag-source.outputs.source != ''
        with:
          node-version: '24'

      - name: validate recovery commit
        if: steps.tag-source.outputs.source == 'recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_COMMIT: ${{ inputs.recovery-commit }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          MATCHES="$(gh api "repos/$REPO/commits/$RECOVERY_COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .merge_commit_sha == env.RECOVERY_COMMIT and .base.ref == "main" and .head.ref == "changeset-release/main" and .head.repo.full_name == env.REPO and .title == "Version Packages" and (.user.login == "app/github-actions" or .user.login == "github-actions[bot]" or .user.login == env.REPO_OWNER))] | length')"
          if [ "$MATCHES" != '1' ]; then
            printf '%s\n' "$RECOVERY_COMMIT is not the merge commit of the generated Version Packages PR." >&2
            exit 1
          fi

      - name: read renderer version
        id: renderer-version
        if: steps.tag-source.outputs.source != ''
        run: |
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('packages/renderer/package.json')).version)")"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      # Run the same consistency gate before the immutable handoff and again in
      # publish.yml as defense in depth. The latter is too late to avoid poisoning
      # a version tag when a generated PR was edited or synchronization regressed.
      - name: release tree must match the tag
        if: steps.tag-source.outputs.source != ''
        env:
          RELEASE_TAG: v${{ steps.renderer-version.outputs.version }}
        run: node tools/check-release-tag.mjs

      # The primary irreversible-boundary protection for the release CHANNEL,
      # as distinct from the tree check above. A tag cannot be taken back, and
      # publish.yml refusing later would leave one behind pointing at a release
      # that must not become `latest`. Failing here leaves no tag, nothing
      # published, and nothing to clean up: the maintainer retries once
      # `@deepseek-ai/dsh@latest` is the adopted generation, or migrates
      # HARNESS_TARGET onto whichever generation Harness promoted.
      - name: the default Harness install must be the adopted generation
        if: steps.tag-source.outputs.source != ''
        run: node tools/check-release-harness.mjs

      - name: check for an existing release tag
        id: existing-tag
        if: steps.tag-source.outputs.source != ''
        env:
          RELEASE_TAG: v${{ steps.renderer-version.outputs.version }}
        run: |
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [ -z "$REMOTE_TAG" ]; then
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE_COMMIT="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [ -z "$REMOTE_COMMIT" ]; then
            REMOTE_COMMIT="$(printf '%s\n' "$REMOTE_TAG" | cut -f1)"
          fi
          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          if [ "$REMOTE_COMMIT" != "$EXPECTED_COMMIT" ]; then
            printf 'Tag %s points at %s, not intended commit %s. It will not be moved.\n' \
              "$RELEASE_TAG" "$REMOTE_COMMIT" "$EXPECTED_COMMIT" >&2
            exit 1
          fi
          printf 'Tag %s already points at the intended commit; leaving it unchanged.\n' "$RELEASE_TAG"
          printf 'exists=true\n' >> "$GITHUB_OUTPUT"

      # GitHub keeps only one pending run in a concurrency group. Leave the next
      # tag absent while a publisher is queued, waiting for approval, or running;
      # the failed handoff can then be retried without moving an immutable tag.
      - name: no release may already be active
        if: steps.tag-source.outputs.source != '' && steps.existing-tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$ACTIVE" != '0' ]; then
            printf '%s\n' 'Another release is queued, awaiting approval, or running.' >&2
            printf '%s\n' 'Wait for it to finish, then rerun this handoff; no new tag was created.' >&2
            exit 1
          fi

      # GitHub intentionally suppresses workflow events created with GITHUB_TOKEN.
      # This dedicated fine-grained PAT must have only Contents: write; unlike the
      # job token, its tag push starts publish.yml and therefore preserves the
      # tag-only release entry point.
      - name: create and push release tag
        if: steps.tag-source.outputs.source != '' && steps.existing-tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RECOVERY_COMMIT: ${{ inputs.recovery-commit }}
          RELEASE_TAG: v${{ steps.renderer-version.outputs.version }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          if [ "$WORKFLOW_EVENT" = 'workflow_dispatch' ]; then
            echo "Recovery mode: tagging commit $RECOVERY_COMMIT"
            echo 'This tag was pushed via manual recovery dispatch, not a merged PR.'
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RECOVERY_COMMIT^{commit}")"
            git merge-base --is-ancestor "$RECOVERY_COMMIT" origin/main
          fi
          git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"
          # A local annotated tag object does not exist on GitHub, so creating a
          # ref to it returns 422. Create the annotated object through the API
          # first, then publish the ref that points at GitHub's object.
          TAG_OBJECT="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f "tag=$RELEASE_TAG" \
            -f "message=Release $RELEASE_TAG" \
            -f "object=$(git rev-parse HEAD)" \
            -f 'type=commit' \
            --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$TAG_OBJECT"
