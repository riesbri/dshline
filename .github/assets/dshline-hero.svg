<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="464" viewBox="0 0 1728 464" role="img">
<title>dshline — terminal-native frontend for DeepSeek Harness</title>
<style>
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
  .white{fill:#f4f7f8} .muted{fill:#aeb9bf} .cyan{fill:#28d8d2}
  .chip{fill:#0a0e11;stroke:#263238;stroke-width:1.5}
  .chiptext{fill:#aeb9bf;font-size:19px}
</style>
<rect width="1728" height="464" fill="#000000"/>

<rect x="600" y="122" width="77" height="85" rx="11" fill="none" stroke="#2bd5d0" stroke-width="4.2"/>
<text x="618" y="174" class="mono white" font-size="37" font-weight="700">&gt;_</text>
<text x="715" y="192" class="mono white" font-size="104" font-weight="700" letter-spacing="-3.5">dsh</text>
<text x="892" y="192" class="mono cyan" font-size="104" font-weight="700" letter-spacing="-3.5">line</text>

<text x="864" y="270" class="mono muted" font-size="21" text-anchor="middle">Terminal-native frontend for DeepSeek Harness</text>

<rect x="464" y="310" width="322" height="42" rx="7" class="chip"/>
<text x="625" y="338" class="mono chiptext" text-anchor="middle">Real terminal scrollback</text>
