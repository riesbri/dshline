<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="720" viewBox="0 0 1728 720" role="img">
<title>dshline — a terminal-native frontend for DeepSeek Harness</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b0f"/><stop offset=".55" stop-color="#091015"/><stop offset="1" stop-color="#05080b"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#28d8d2" stop-opacity=".12"/><stop offset="1" stop-color="#28d8d2" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#17313a" opacity=".55"/>
  </pattern>
  <style>
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    .white{fill:#f4f7f8} .muted{fill:#aeb9bf} .cyan{fill:#28d8d2}
  </style>
</defs>
<rect width="1728" height="720" fill="url(#bg)"/>
<rect y="540" width="1728" height="180" fill="url(#dots)"/>
<ellipse cx="864" cy="272" rx="640" ry="290" fill="url(#glow)"/>

<rect x="554" y="190" width="91" height="100" rx="14" fill="none" stroke="#2bd5d0" stroke-width="5"/>
<text x="576" y="251" class="mono white" font-size="43" font-weight="700">&gt;_</text>
<text x="689" y="280" class="mono white" font-size="122" font-weight="700" letter-spacing="-4">dsh</text>
<text x="897" y="280" class="mono cyan" font-size="122" font-weight="700" letter-spacing="-4">line</text>

<text x="864" y="394" class="mono muted" font-size="44" text-anchor="middle">A <tspan class="white">terminal-native</tspan> frontend for DeepSeek Harness</text>

<line x1="828" y1="460" x2="900" y2="460" stroke="#28d8d2" stroke-width="3"/>

<text x="864" y="536" class="mono white" font-size="30" text-anchor="middle">Real terminal scrollback <tspan class="cyan">&#183;</tspan> Direct Harness <tspan class="cyan">&#183;</tspan> Provider-neutral</text>
</svg>
